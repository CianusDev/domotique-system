services:
  postgres:
    image: postgres:16-alpine
    container_name: domotique-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: domotique-mqtt
    restart: always
    entrypoint: >
      sh -c "rm -f /mosquitto/config/passwd
      && mosquitto_passwd -c -b /mosquitto/config/passwd $$MQTT_USER $$MQTT_PASSWORD
      && chown mosquitto:mosquitto /mosquitto/config/passwd
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./backend/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domotique-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      APP_NAME: ${APP_NAME:-DomotiqueSystem}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_PASS: ${GMAIL_PASS}
      MQTT_BROKER_URL: mqtt://${MQTT_USER}:${MQTT_PASSWORD}@mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
