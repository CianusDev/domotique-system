; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ─── Shared settings ────────────────────────────────────────────
[common]
lib_deps =
  knolleary/PubSubClient @ ^2.8          ; MQTT client
  bblanchon/ArduinoJson @ ^7.0           ; JSON parsing/serialization
  adafruit/DHT sensor library @ ^1.4.6   ; DHT11 / DHT22
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  paulstoffregen/OneWire @ ^2.3.8        ; 1-Wire bus (DS18B20)
  milesburton/DallasTemperature @ ^4.0.0 ; DS18B20 temperature

build_unflags =
  -std=gnu++11
  -std=c++11

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
  -Os

monitor_speed = 115200

; ─── ESP32 DevKit (development) ──────────────────────────────────
[env:esp32dev]
platform = espressif32
board    = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
  ${common.build_flags}
  -DDEBUG_BUILD=1
board_build.partitions = min_spiffs.csv
upload_speed = 921600
monitor_speed = ${common.monitor_speed}

; ─── ESP32 production (OTA only) ─────────────────────────────────
[env:esp32dev_ota]
platform  = espressif32
board     = esp32dev
framework = arduino
lib_deps  = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
  ${common.build_flags}
board_build.partitions = min_spiffs.csv
upload_protocol = espota
; upload_port = <device-ip>   ; set before OTA flash
