# Mosquitto MQTT Broker config — domotique-system

# TCP listener
listener 1883
protocol mqtt

# WebSocket listener (for Flutter web / debug tools)
listener 9001
protocol websockets

password_file /mosquitto/config/passwd
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
